<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive YouTube Video</title>
</head>
<body>
    <h2>My Favorite Video</h2>
    <!-- Using percentage width and height for responsiveness -->
    <iframe 
        width="80%" 
        height="60%" 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
        title="YouTube video"
        frameborder="0"
        allowfullscreen>
    </iframe>
</body>
</html>
